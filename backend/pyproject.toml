[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradeflow-api"
version = "0.1.0"
description = "FastAPI, Supabase, Gemini and LangGraph grading MVP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "supabase>=2.15,<3",
  "bcrypt>=4.2,<5",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "google-genai>=1.20,<2",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly. Ruff's default rule set changes between releases, so
# leaving this unset made `make lint` pass or fail depending on which version
# happened to be installed.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  # FastAPI is built around `Depends()` / `File()` in argument defaults, so
  # this rule fires on every route and never indicates a real problem.
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# `backend/supabase/` holds the SQL schema, and its name shadows the `supabase`
# PyPI package — without this, isort files the client import as first-party and
# sorts it in among the local ones.
known-third-party = ["supabase"]
